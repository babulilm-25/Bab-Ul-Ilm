name: Phase 16 Apply And Verify
on:
  push:
    paths:
      - "scripts/phase16_apply.py"
      - "src/phase16.tsx"
      - "supabase/migrations/20260923200000_phase16_hr_payroll_data_tools.sql"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  phase16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install xlsx@0.18.5
      - name: Apply frontend wiring
        run: python3 scripts/phase16_apply.py
      - name: Typecheck and build
        run: npm run build
      - name: Commit Phase 16 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/phase16.tsx scripts/phase16_apply.py package.json package-lock.json supabase/migrations/20260923200000_phase16_hr_payroll_data_tools.sql .github/workflows/phase16-apply.yml
          git diff --cached --quiet || git commit -m "feat: complete phase 16 product gaps"
          git push
