name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  VITE_SUPABASE_URL: https://btmkatizfbbasgnxprsa.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_RcEOgd6rde-K0KRarEToxA_f4V5_Tf4

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Excel support
        run: npm install xlsx@0.18.5
      - name: Apply Phase 16 frontend wiring
        run: python3 scripts/phase16_apply.py
      - name: Commit Phase 16 frontend changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx package.json package-lock.json
          git diff --cached --quiet || git commit -m "feat: wire phase 16 modules"
          git push || true
      - name: Prepare app branding assets
        run: |
          mkdir -p assets
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 public/logo.svg -o assets/logo.png
      - name: Build web
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Generate native app icons
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#0a3027' --iconBackgroundColorDark '#0a3027' --splashBackgroundColor '#0a3027' --splashBackgroundColorDark '#071e18'
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bab-ul-ilm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: bab-ul-ilm-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
